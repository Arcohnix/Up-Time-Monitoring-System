services:
  # ============================================================================
  # 1. PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: utms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-utms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - utms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-utms}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. FastAPI Backend & Continuous Monitoring Scheduler
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utms_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-Uptime Monitoring System}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-utms}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - SCHEDULER_TICK_INTERVAL_SECONDS=${SCHEDULER_TICK_INTERVAL_SECONDS:-1.0}
      - SCHEDULER_MAX_CONCURRENCY=${SCHEDULER_MAX_CONCURRENCY:-50}
      - ALERT_WEBHOOK_ENABLED=${ALERT_WEBHOOK_ENABLED:-false}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TIMEOUT_SECONDS=${ALERT_WEBHOOK_TIMEOUT_SECONDS:-10.0}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - ALERT_EMAIL_SMTP_HOST=${ALERT_EMAIL_SMTP_HOST:-}
      - ALERT_EMAIL_SMTP_PORT=${ALERT_EMAIL_SMTP_PORT:-587}
      - ALERT_EMAIL_SMTP_USER=${ALERT_EMAIL_SMTP_USER:-}
      - ALERT_EMAIL_SMTP_PASSWORD=${ALERT_EMAIL_SMTP_PASSWORD:-}
      - ALERT_EMAIL_USE_TLS=${ALERT_EMAIL_USE_TLS:-true}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@utms.local}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    networks:
      - utms_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # ============================================================================
  # 3. Production Frontend SPA (React + Vite + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - utms_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  # ============================================================================
  # 4. Observability: Prometheus Metrics Scraper
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: utms_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - utms_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 5. Observability: Grafana Metrics Visualizer & Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: utms_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/utms-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - utms_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  # ============================================================================
  # 6. Self-Health: Decoupled External Watchdog Service
  # ============================================================================
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utms_watchdog
    command: ["python", "-m", "watchdog.main"]
    restart: unless-stopped
    environment:
      - WATCHDOG_TARGET_URL=http://backend:8000
      - WATCHDOG_CHECK_INTERVAL_SECONDS=${WATCHDOG_CHECK_INTERVAL_SECONDS:-5.0}
      - WATCHDOG_TIMEOUT_SECONDS=${WATCHDOG_TIMEOUT_SECONDS:-5.0}
      - WATCHDOG_FAILURE_THRESHOLD=${WATCHDOG_FAILURE_THRESHOLD:-2}
      - WATCHDOG_HEARTBEAT_STALE_THRESHOLD_SECONDS=${WATCHDOG_HEARTBEAT_STALE_THRESHOLD_SECONDS:-30.0}
      - WATCHDOG_ALERT_WEBHOOK_URL=${WATCHDOG_ALERT_WEBHOOK_URL:-}
    networks:
      - utms_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 10s

volumes:
  postgres_data:
    name: utms_postgres_data
  grafana_data:
    name: utms_grafana_data

networks:
  utms_network:
    name: utms_network
    driver: bridge
