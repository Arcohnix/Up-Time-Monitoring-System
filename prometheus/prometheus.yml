global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'utms-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['backend:8000']
        labels:
          app: 'utms'
          service: 'uptime-monitoring-system'
